<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gh-downloader 原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202522;background:#f3f5f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:760px}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5e9e5;display:flex;align-items:center;padding:0 30px;gap:24px}.brand{font-weight:750;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}.mark{width:27px;height:27px;border-radius:8px;background:#263b32;color:#c9f279;display:grid;place-items:center;font-weight:800}.nav{display:flex;gap:24px;margin-left:36px;color:#737a74;font-size:13px}.nav .on{color:#263b32;font-weight:650}.avatar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#e5eddb;display:grid;place-items:center;font-size:12px;font-weight:700;color:#476338}.main{max-width:1220px;margin:0 auto;padding:38px 38px 100px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#748078;font-weight:700}.title{font-size:26px;margin:7px 0 5px;letter-spacing:-.7px}.sub{font-size:13px;color:#818983;margin:0}.search{margin-top:25px;display:flex;align-items:center;height:52px;background:#fff;border:1px solid #dce2dc;border-radius:8px;padding:0 6px 0 16px;box-shadow:0 3px 10px #1d332108}.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px;color:#27312b}.search input::placeholder{color:#a5aca5}.search button,.primary{border:0;border-radius:6px;padding:10px 16px;background:#263b32;color:white;font-size:13px;font-weight:650}.repohead{display:flex;align-items:center;margin:28px 0 22px;gap:13px}.repoicon{width:38px;height:38px;background:#e5eae4;border-radius:9px;display:grid;place-items:center;color:#34443b;font-weight:700}.reponame{font-size:17px;font-weight:700}.repourl{font-size:12px;color:#818983;margin-top:3px}.tag{font-size:11px;color:#56635a;border:1px solid #dce2dc;padding:4px 8px;border-radius:4px;margin-left:2px}.repo-meta{margin-left:auto;color:#848d86;font-size:12px}.content{display:grid;grid-template-columns:1fr 280px;gap:24px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead h2{font-size:15px;margin:0}.sort{border:1px solid #dce2dc;border-radius:5px;padding:7px 9px;color:#606962;background:#fff;font-size:11px}.release{border:1px solid #e1e6e1;border-radius:7px;background:white;margin-bottom:12px;overflow:hidden}.release-top{padding:15px 17px;display:flex;align-items:flex-start;gap:10px}.dot{width:8px;height:8px;border-radius:50%;background:#79a94f;margin-top:5px}.relname{font-size:14px;font-weight:700}.relmeta{font-size:11px;color:#8a928b;margin-top:4px}.latest{font-size:10px;color:#54752f;background:#edf5e4;border-radius:3px;padding:4px 6px;margin-left:6px}.relright{margin-left:auto;text-align:right;color:#737c74;font-size:11px}.asset{height:43px;border-top:1px solid #edf0ed;display:flex;align-items:center;padding:0 17px;gap:10px;font-size:12px}.fileicon{width:19px;height:21px;border:1.5px solid #aeb7ae;border-radius:3px;position:relative}.fileicon:after{content:"";position:absolute;left:4px;right:4px;top:7px;border-top:1px solid #aeb7ae;box-shadow:0 4px #aeb7ae}.filename{font-weight:550;color:#38423a}.filesize{color:#939b94;font-size:11px}.dl{margin-left:auto;border:1px solid #dfe5df;border-radius:5px;background:#fff;padding:6px 10px;color:#48554a;font-size:11px}.dl:hover{background:#f1f5ee}.sidebar{border-left:1px solid #e0e5e0;padding-left:19px}.side-title{font-size:12px;font-weight:700;margin:0 0 12px}.sidebox{background:#fff;border:1px solid #e1e6e1;border-radius:7px;padding:14px;margin-bottom:12px}.side-label{font-size:10px;color:#89928a;margin-bottom:7px}.side-value{font-size:12px;font-weight:600}.platform{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #eff1ef;font-size:11px;color:#4f5a51}.platform:first-of-type{border:0}.badge{font-size:10px;color:#537236;background:#edf5e4;padding:3px 6px;border-radius:4px}.taskline{display:flex;gap:9px;align-items:center}.taskdot{width:7px;height:7px;border-radius:50%;background:#83b352}.taskname{font-size:11px;font-weight:600}.tasksub{font-size:10px;color:#919a92;margin-top:3px}.progress{height:3px;background:#edf0ed;margin-top:10px;border-radius:3px}.progress i{display:block;width:68%;height:100%;background:#7baa4f;border-radius:3px}.setting-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eff1ef;padding:12px 0;font-size:11px;color:#566058}.setting-row:first-of-type{border-top:0}.switch{height:17px;width:30px;border-radius:10px;background:#cbd4ca;position:relative}.switch:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:white;box-shadow:0 1px 2px #0002}.switch.on{background:#70994e}.switch.on:after{left:15px}.variants{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;background:#202c26;color:white;border-radius:28px;padding:8px 11px;box-shadow:0 6px 24px #17231c38;z-index:10;font-size:11px}.variants button{border:0;background:transparent;color:white;width:25px;height:25px;border-radius:50%;font-size:16px}.variants button:hover{background:#ffffff22}.variant-name{min-width:130px;text-align:center}.variant-name b{color:#d0edaa}.toast{position:fixed;right:25px;bottom:25px;background:#263b32;color:#fff;padding:11px 15px;border-radius:6px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
/* Variant B: version timeline */
.b .content{display:block}.b .sidebar{display:none}.b .release{display:grid;grid-template-columns:170px 1fr;margin:0;border:0;border-bottom:1px solid #e1e6e1;border-radius:0;background:transparent;overflow:visible}.b .release-top{padding:20px 16px 20px 0;position:relative}.b .release-top:after{content:"";position:absolute;left:3px;top:38px;bottom:-18px;border-left:1px solid #cbd5c9}.b .release:last-child .release-top:after{display:none}.b .dot{z-index:1;box-shadow:0 0 0 4px #f3f5f2}.b .release-assets{padding:7px 0}.b .asset{background:#fff;border:1px solid #e5e9e5;border-radius:6px;margin:5px 0;padding:0 12px;height:39px}.b .release-top .relright{display:none}.b .latest{display:block;width:max-content;margin:6px 0 0}.b .sectionhead{margin-bottom:7px}.b .repohead{margin-bottom:25px}
/* Variant C: asset-first table */
.c .content{display:block}.c .sidebar{display:none}.c .release{border:0;border-radius:0;background:transparent;margin:0}.c .release-top{padding:19px 14px 9px;background:transparent}.c .release-assets{border:1px solid #e1e6e1;border-radius:7px;background:#fff;overflow:hidden}.c .asset{height:47px}.c .release+.release{margin-top:4px}.c .asset .dl{min-width:82px}.c .sectionhead h2:after{content:"  ·  12 个文件";font-size:11px;color:#89928a;font-weight:400}.c .reponame{font-size:18px}
@media(max-width:900px){.main{padding-left:22px;padding-right:22px}.content{grid-template-columns:1fr 240px}.repo-meta{display:none}}
</style>
</head>
<body><div class="app" id="app"></div><div class="variants"><button id="prev" aria-label="上一方案">‹</button><span class="variant-name" id="variantName"></span><button id="next" aria-label="下一方案">›</button></div><div class="toast" id="toast">已加入下载队列</div>
<script>
const releases=[
 {tag:'v2.8.4',date:'2025年10月24日',notes:'新增 Mihomo 内核管理，修复订阅更新问题。',latest:true,files:[['pure-clash_2.8.4_windows_x64.zip','18.4 MB'],['pure-clash_2.8.4_windows_arm64.zip','17.9 MB'],['pure-clash_2.8.4_macos_universal.dmg','22.1 MB'],['checksums.txt','1.2 KB']]},
 {tag:'v2.8.3',date:'2025年10月11日',notes:'优化配置编辑器与启动性能。',files:[['pure-clash_2.8.3_windows_x64.zip','18.1 MB'],['pure-clash_2.8.3_macos_universal.dmg','21.8 MB'],['checksums.txt','1.2 KB']]},
 {tag:'v2.8.2',date:'2025年9月28日',notes:'修复若干已知问题。',files:[['pure-clash_2.8.2_windows_x64.zip','17.8 MB'],['pure-clash_2.8.2_macos_universal.dmg','21.5 MB']]}
];
const variants=[['A','Release 工作台'],['B','版本时间线'],['C','下载清单']];let index=Math.max(0,variants.findIndex(x=>x[0]===new URLSearchParams(location.search).get('variant')));
function asset(file){return `<div class="asset"><span class="fileicon"></span><span class="filename">${file[0]}</span><span class="filesize">${file[1]}</span><button class="dl" onclick="download(this)">↓ 下载</button></div>`}
function release(r){return `<article class="release"><div class="release-top"><i class="dot"></i><div><div class="relname">${r.tag}${r.latest?'<span class="latest">最新</span>':''}</div><div class="relmeta">${r.date} · ${r.notes}</div></div><div class="relright">${r.files.length} 个文件</div></div><div class="release-assets">${r.files.map(asset).join('')}</div></article>`}
function render(){const v=variants[index];document.body.className=v[0].toLowerCase();document.getElementById('variantName').innerHTML=`<b>${v[0]}</b> · ${v[1]}`;const assets=releases.map(release).join('');document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="mark">g</span> gh-downloader</div><nav class="nav"><span class="on">仓库</span><span>下载</span><span>设置</span></nav><div class="avatar">G</div></header><main class="main"><div class="eyebrow">GITHUB RELEASE FINDER</div><h1 class="title">找到你要的版本</h1><p class="sub">粘贴 GitHub 仓库地址，浏览并下载 Release 文件。</p><div class="search"><span style="color:#89928a;margin-right:10px">⌕</span><input value="https://github.com/prime-zt/pure-clash" aria-label="GitHub 仓库地址"><button onclick="toast('已加载仓库 Releases')">查看仓库　↵</button></div><div class="repohead"><div class="repoicon">PC</div><div><div class="reponame">pure-clash <span class="tag">Public</span></div><div class="repourl">prime-zt / pure-clash</div></div><div class="repo-meta">★ 1.2k　⑂ 186　更新于 2 天前</div></div><div class="content"><section><div class="sectionhead"><h2>Releases <span style="font-weight:400;color:#8a928b">12</span></h2><button class="sort">排序：最新优先　⌄</button></div>${assets}</section><aside class="sidebar"><h3 class="side-title">下载设置</h3><div class="sidebox"><div class="side-label">保存到</div><div class="side-value">~/Downloads <span style="float:right;color:#71836f">更改</span></div></div><div class="sidebox"><div class="side-label">代理</div><div class="setting-row"><span>使用代理</span><span class="switch on"></span></div><div class="side-label" style="margin-top:7px">HTTP / SOCKS5 · 自定义地址</div><div class="side-value" style="font-size:11px;color:#606b62">127.0.0.1 : 1080</div></div><h3 class="side-title" style="margin-top:20px">下载中 <span style="color:#8a928b;font-weight:400">1</span></h3><div class="sidebox"><div class="taskline"><i class="taskdot"></i><div><div class="taskname">pure-clash_windows_x64.zip</div><div class="tasksub">12.5 MB / 18.4 MB · 4.2 MB/s</div></div></div><div class="progress"><i></i></div></div></aside></div></main>`;history.replaceState(null,'',`?variant=${v[0]}`)}
function move(n){index=(index+n+variants.length)%variants.length;render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}function download(btn){btn.textContent='排队中';btn.disabled=true;toast('已加入下载队列')}render();
</script></body></html>
