[package]
name = "gh-downloader"
version = "0.0.2"
description = "A lightweight GitHub release downloader"
authors = ["gh-downloader"]
edition = "2021"

[lib]
name = "gh_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "system-proxy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
futures-util = "0.3"
fs2 = "0.4"
directories = "6"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
