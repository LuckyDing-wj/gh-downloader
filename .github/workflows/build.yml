name: Build and release desktop app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            bundles: nsis,msi
          - os: macos-latest
            artifact: macos
            bundles: dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Locate Tauri bundler tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "TAURI_TOOLS=$env:LOCALAPPDATA\tauri"

      - name: Cache Tauri bundler tools
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ${{ env.TAURI_TOOLS }}
          key: tauri-bundler-tools-${{ runner.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$APP_VERSION" = "$TAG_VERSION"

      - name: Check frontend and Rust
        run: |
          npm run check
          npm run test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        shell: bash

      - name: Build bundles
        run: npm run build:desktop -- --bundles ${{ matrix.bundles }}

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: gh-downloader-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: gh-downloader-*
          path: release-assets
          merge-multiple: true

      - name: Create release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No installer assets were downloaded" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --title "$GITHUB_REF_NAME" --generate-notes
